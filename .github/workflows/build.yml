name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore iPhoneRingsMaker.sln
      - name: Verify formatting
        run: dotnet format iPhoneRingsMaker.sln --verify-no-changes --no-restore
      - name: Build Debug x64
        run: dotnet build iPhoneRingsMaker.sln -c Debug -p:Platform=x64 --no-restore
      - name: Run tests
        run: dotnet test iPhoneRingsMaker.sln -c Debug -p:Platform=x64 --no-build
      - name: Build Release x64
        run: dotnet build iPhoneRingsMaker.sln -c Release -p:Platform=x64 --no-restore
